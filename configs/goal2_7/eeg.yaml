extends: models.yaml

eeg:
  preprocessing_version: v1_deep_window_cache_rederived_goal2_7_event_audited
  feature_version: goal2_7_eeg_window_traditional_event_validity_v1
  channels:
    - Fp1
    - Fp2
    - Fz
    - F3
    - F4
    - F7
    - F8
    - FC1
    - FC2
    - FC5
    - FC6
    - Cz
    - C3
    - C4
    - T7
    - T8
    - A1
    - A2
    - CP1
    - CP2
    - CP5
    - CP6
    - Pz
    - P3
    - P4
    - P7
    - P8
    - PO3
    - PO4
    - Oz
    - O1
    - O2
  tasks:
    rest:
      signal_features: artifacts/goal2_7/eeg/rest_signal_features.csv
      qc_features: artifacts/goal2_7/eeg/rest_qc_features.csv
      metadata_csv: experiments/v1/eeg/artifacts/deep/windows/metadata_rest.csv
      qa_csv: experiments/v1/eeg/artifacts/deep/windows/qa_rest.csv
      window_npy: experiments/v1/eeg/artifacts/deep/windows/X_rest.npy
      sfreq: 250.0
      epoch_tmin: 0.0
      epoch_tmax: 5.0
      min_valid_windows: 10
      max_feature_windows: 16
      task_status: event_free_rest
    oddball:
      signal_features: artifacts/goal2_7/eeg/oddball_target_only_proxy_signal_features.csv
      qc_features: artifacts/goal2_7/eeg/oddball_target_only_proxy_qc_features.csv
      metadata_csv: experiments/v1/eeg/artifacts/deep/windows/metadata_oddball.csv
      qa_csv: experiments/v1/eeg/artifacts/deep/windows/qa_oddball.csv
      window_npy: experiments/v1/eeg/artifacts/deep/windows/X_oddball.npy
      sfreq: 250.0
      epoch_tmin: -0.2
      epoch_tmax: 0.8
      min_valid_windows: 8
      max_feature_windows: 24
      event_codes: ["22"]
      task_status: oddball_target_only_proxy_event_semantics_blocked
    1back:
      signal_features: artifacts/goal2_7/eeg/1back_generic_signal_features.csv
      qc_features: artifacts/goal2_7/eeg/1back_generic_qc_features.csv
      metadata_csv: experiments/v1/eeg/artifacts/deep/windows/metadata_1back.csv
      qa_csv: experiments/v1/eeg/artifacts/deep/windows/qa_1back.csv
      window_npy: experiments/v1/eeg/artifacts/deep/windows/X_1back.npy
      sfreq: 250.0
      epoch_tmin: -0.2
      epoch_tmax: 1.8
      min_valid_windows: 6
      max_feature_windows: 24
      event_codes: ["18", "19"]
      task_status: condition_semantics_blocked_generic_only
  v1_rest_control:
    path: experiments/v1/eeg/artifacts/features/eeg_rest_features.csv
    output_name: eeg_rest_v1_features_fixed_split
