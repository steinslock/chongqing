project_config: configs/default.yaml

run:
  stage: Goal 2.9
  seed: 20260908
  split_group: cv
  label_column: primary_label_nonhealthy
  n_jobs: 8

paths:
  split_file: artifacts/splits/subject_splits_v1.csv
  group_split_file: artifacts/splits/subject_splits_group_robustness_v1.csv
  groups_file: artifacts/groups/subject_groups.csv
  paradigm_spec: configs/goal2_8/paradigm_spec.yaml
  artifacts_dir: artifacts/goal2_9
  results_dir: results/goal2_9
  reports_dir: reports

protocol:
  pilot_holdout_policy: >-
    the baseline-exposed pilot holdout is excluded from Goal 2.9 feature
    extraction, model development, threshold selection, and reporting
  outer_folds: [0, 1, 2, 3, 4]
  inner_cv_folds: 3
  cv_protocols:
    standard_cv:
      split_file: artifacts/splits/subject_splits_v1.csv
      fold_column: cv_fold
    group_cv:
      split_file: artifacts/splits/subject_splits_group_robustness_v1.csv
      fold_column: robustness_fold

demographics:
  age_min: 9
  age_max: 20
