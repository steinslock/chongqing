extends: common.yaml

models:
  tabular:
    - logistic_regression
    - random_forest
    - hist_gradient_boosting
  face_embedding:
    - logistic_regression
    - hist_gradient_boosting

hyperparameters:
  logistic_regression:
    - model__C: 0.1
      model__penalty: l2
      model__solver: liblinear
    - model__C: 1.0
      model__penalty: l2
      model__solver: liblinear
    - model__C: 0.3
      model__penalty: l1
      model__solver: liblinear
    - model__C: 1.0
      model__penalty: l1
      model__solver: liblinear
  random_forest:
    - model__n_estimators: 120
      model__max_depth:
      model__min_samples_leaf: 5
      model__max_features: sqrt
    - model__n_estimators: 160
      model__max_depth: 8
      model__min_samples_leaf: 8
      model__max_features: sqrt
    - model__n_estimators: 160
      model__max_depth: 12
      model__min_samples_leaf: 5
      model__max_features: 0.5
  hist_gradient_boosting:
    - model__max_iter: 10
      model__learning_rate: 0.05
      model__max_leaf_nodes: 7
      model__l2_regularization: 0.0

fallbacks:
  lightgbm: hist_gradient_boosting
  reason: LightGBM and XGBoost are not installed in the current avmoe environment; sklearn HistGradientBoostingClassifier is used as the documented boosting fallback.
