extends: models.yaml

face:
  preprocessing_version: goal2_6_face_resnet18_frozen_v1
  feature_version: goal2_6_face_frozen_embedding_v1
  tasks:
    self_intro:
      raw_dir: 面部/面部1-自我介绍1分钟
      availability_csv: artifacts/face/video_availability_self_intro.csv
      signal_features: artifacts/goal2_6/face/self_intro_signal_features.csv
      qc_features: artifacts/goal2_6/face/self_intro_qc_features.csv
    task:
      raw_dir: 面部/面部2-任务
      availability_csv: artifacts/face/video_availability_task.csv
      signal_features: artifacts/goal2_6/face/task_signal_features.csv
      qc_features: artifacts/goal2_6/face/task_qc_features.csv
  sample_frames: 8
  input_size: 224
  batch_size: 64
  checkpoint_every_videos: 100
  detector:
    name: opencv_haar_fallback
    threshold: minNeighbors=4
    note: MediaPipe/MTCNN/RetinaFace were not installed; Haar crops are reported as fallback and interpreted with shortcut caution.
  encoder:
    name: torchvision_resnet18
    checkpoint: ResNet18_Weights.IMAGENET1K_V1
    feature_dimension: 512
    frozen: true
    checkpoint_source: torchvision_download_cache
  outputs:
    contact_sheet: artifacts/goal2_6/face/face_detection_contact_sheet.jpg
    manifest: artifacts/goal2_6/face/encoder_manifest.json
