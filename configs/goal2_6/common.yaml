project_config: configs/default.yaml

run:
  stage: Goal 2.6
  seed: 20260707
  split_group: cv
  label_column: primary_label_nonhealthy
  n_jobs: 4
  smoke_limit_per_class:
  overwrite: true

paths:
  split_file: artifacts/splits/subject_splits_v1.csv
  group_split_file: artifacts/splits/subject_splits_group_robustness_v1.csv
  core3_qc_file: artifacts/cohorts_v2/core3_complete_qc.csv
  groups_file: artifacts/groups/subject_groups.csv
  artifacts_dir: artifacts/goal2_6
  results_dir: results/goal2_6
  reports_dir: reports

outputs:
  all_fold_metrics: results/goal2_6/all_fold_metrics.csv
  all_oof_predictions: results/goal2_6/all_oof_predictions.csv
  all_pooled_metrics: results/goal2_6/all_pooled_metrics.csv
  bootstrap_ci: results/goal2_6/bootstrap_confidence_intervals.csv
  paired_comparisons: results/goal2_6/paired_model_comparisons.csv
  native_cohort_summary: results/goal2_6/native_cohort_summary.csv
  core3_same_cohort_summary: results/goal2_6/core3_same_cohort_summary.csv
  shortcut_baseline_summary: results/goal2_6/shortcut_baseline_summary.csv
  selected_hyperparameters: results/goal2_6/selected_hyperparameters.csv
  pca_explained_variance: results/goal2_6/pca_explained_variance.csv
  feature_counts: results/goal2_6/feature_counts.csv
  exclusion_summary: results/goal2_6/exclusion_summary.csv
  group_robustness_summary: results/goal2_6/group_robustness_summary.csv
  manifest: artifacts/goal2_6/run_manifest.json

protocol:
  pilot_holdout_policy: baseline-exposed pilot holdout is excluded from Goal 2.6 feature extraction, model development, model selection, threshold selection, and reporting
  outer_folds: [0, 1, 2, 3, 4]
  inner_cv_folds: 3
  threshold_grid: [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8]
  calibration_bins: 10
  max_pca_components: 64
  random_state: 20260707

feature_sets:
  base:
    - demographics
    - qc
    - signal
  increments:
    - signal_qc
    - signal_demographics
    - signal_qc_demographics

demographics:
  numeric_columns:
    - age_clean
  categorical_columns:
    - sex_clean
    - grade_clean
    - grade_group_clean
  age_min: 9
  age_max: 20
